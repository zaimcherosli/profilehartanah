<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zaim Rosli (REN39575)</title>
  <meta name="description" content="Property listing and image management portal for Zaim Rosli.">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      max-width: 100vw;
      overflow-x: hidden !important;
    }

    .admin-wrapper {
      padding-top: 90px;
      padding-bottom: 60px;
    }

    .admin-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .admin-table-wrap {
      display: block;
      width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .admin-table th, .admin-table td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .admin-table th {
      background: var(--bg-alt);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .admin-mobile-wrap {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .thumbs-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      min-height: 80px;
      padding: 12px;
      background: var(--bg-alt);
      border-radius: var(--radius-md);
      border: 2px dashed var(--border-color);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
    }

    @media (max-width: 768px) {
      .admin-wrapper {
        padding-top: 80px;
      }
      .admin-header-bar {
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
        padding: 16px !important;
      }
      .admin-header-bar h2 {
        font-size: 1.25rem !important;
      }
      .admin-header-bar button {
        width: 100% !important;
      }
      .admin-table-wrap {
        display: none !important;
      }
      .admin-mobile-wrap {
        display: block !important;
      }
      #user-display {
        font-size: 0.78rem !important;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .modal-card {
        padding: 20px 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">
        <span class="logo-main">ZAIM<span>ROSLI</span></span>
        <span class="logo-sub">ADMIN PORTAL</span>
      </a>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="user-display" style="font-size: 0.85rem; font-weight: 700; color: var(--accent-gold);">huzaimrosli@gmail.com</span>
        <button onclick="handleLogout()" class="btn btn-outline btn-sm" style="padding: 6px 12px; font-size: 0.8rem;">🚪 Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Admin Main Section -->
  <div class="container admin-wrapper">
    
    <div class="admin-header-bar">
      <div>
        <h2 style="font-size: 1.4rem; margin-bottom: 4px;">Property Listing Management</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Add, edit, delete & reorder property photos</p>
      </div>
      <button onclick="openModal()" class="btn btn-accent">+ Add New Property</button>
    </div>

    <!-- Desktop Listings Table -->
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Property</th>
            <th>Price</th>
            <th>Location / Region</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-listings-tbody">
          <!-- Rendered dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Mobile Listings Vertical Cards Grid (< 768px) -->
    <div id="admin-listings-mobile" class="admin-mobile-wrap">
      <!-- Rendered dynamically for mobile -->
    </div>

  </div>

  <!-- Modal Add/Edit Property -->
  <div id="property-modal" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="modal-title" style="font-size: 1.25rem;">Add New Property</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 1.8rem; cursor: pointer;">&times;</button>
      </div>

      <form id="prop-form" onsubmit="saveProperty(event)">
        <input type="hidden" id="form-id">

        <div class="form-group" style="margin-bottom: 14px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">PROPERTY TITLE</label>
          <input type="text" id="form-title" class="form-input" placeholder="e.g. The Grand Pavilion Penthouse" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">PRICE (RM)</label>
            <input type="number" id="form-price" class="form-input" placeholder="1250000" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">STATUS</label>
            <select id="form-status" class="form-select" required>
              <option value="sale">FOR SALE</option>
              <option value="rent">FOR RENT</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">LOCATION (City / Area)</label>
            <input type="text" id="form-location" class="form-input" placeholder="KLCC, Kuala Lumpur" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">REGION</label>
            <select id="form-region" class="form-select" required>
              <option value="Kuala Lumpur">Kuala Lumpur</option>
              <option value="Selangor">Selangor</option>
              <option value="Penang">Penang</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">TYPE</label>
            <select id="form-type" class="form-select" required>
              <option value="Condominium">Condominium</option>
              <option value="Terrace House">Terrace House</option>
              <option value="Bungalow">Bungalow</option>
              <option value="Semi-D">Semi-D</option>
              <option value="Studio Suite">Studio Suite</option>
              <option value="Townhouse">Townhouse</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">BEDS</label>
            <input type="number" id="form-beds" class="form-input" value="3" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">BATHS</label>
            <input type="number" id="form-baths" class="form-input" value="2" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">SIZE (SQFT)</label>
            <input type="number" id="form-size" class="form-input" placeholder="1200" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">TENURE</label>
            <select id="form-tenure" class="form-select">
              <option value="Freehold">Freehold</option>
              <option value="Leasehold">Leasehold</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">LOT TYPE</label>
            <select id="form-lotType" class="form-select">
              <option value="Non-Bumi Lot">Non-Bumi Lot</option>
              <option value="Bumi Lot">Bumi Lot</option>
              <option value="Open Title">Open Title</option>
              <option value="Malay Reserve">Malay Reserve</option>
            </select>
          </div>
        </div>

        <!-- Image Upload & Drag Drop Grid -->
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">PROPERTY PHOTOS (R2 STORAGE)</label>
          <div style="display: flex; gap: 10px; margin-bottom: 6px;">
            <input type="file" id="form-image-file" multiple accept="image/*" class="form-input" onchange="handleImageUpload(event)">
          </div>

          <div id="image-thumbs-grid" class="thumbs-grid">
            <!-- Rendered thumbs -->
          </div>
          <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 6px;">
            💡 Hold & drag photos to reorder. Photo 1 is the main photo.
          </p>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:4px;">DESCRIPTION</label>
          <textarea id="form-description" class="form-textarea" style="min-height: 100px;" required></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" onclick="closeModal()" class="btn btn-outline btn-sm">Cancel</button>
          <button type="submit" class="btn btn-accent btn-sm">Save Property</button>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="properties-data.js"></script>
  <script src="app.js"></script>
  <script>
    const SUPABASE_URL = 'https://csrzhidtzqxfbapsenhu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcnpoaWR0enF4ZmJhcHNlbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTM3OTYsImV4cCI6MjEwMTA2OTc5Nn0.NnHFURbQTvsdgGbm1d_PC-hkOgQFQIHKTMQaS2n44SU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentProperties = [];
    let uploadedImageUrls = [];
    let draggedIdx = null;

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const localSess = localStorage.getItem('ZAIM_ROSLI_SESSION');
      if (!session && !localSess) {
        window.location.href = 'login.html';
        return;
      }
      loadPropertiesList();
    }
    checkAuth();

    async function handleLogout() {
      try {
        await supabaseClient.auth.signOut();
      } catch(e) {}
      localStorage.removeItem('ZAIM_ROSLI_SESSION');
      window.location.href = 'login.html?logout=true';
    }

    async function loadPropertiesList() {
      try {
        const res = await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/properties');
        const remoteData = await res.json();
        if (Array.isArray(remoteData) && remoteData.length > 0) {
          currentProperties = remoteData;
          localStorage.setItem('ZAIM_ROSLI_PROPERTIES', JSON.stringify(remoteData));
          renderTable();
          return;
        }
      } catch(e) {}

      const stored = localStorage.getItem('ZAIM_ROSLI_PROPERTIES');
      if (stored) {
        try {
          currentProperties = JSON.parse(stored);
        } catch(e) {
          currentProperties = PROPERTIES_DATA;
        }
      } else {
        currentProperties = PROPERTIES_DATA;
      }

      renderTable();
    }

    function renderTable() {
      const desktopTbody = document.getElementById('admin-listings-tbody');
      const mobileGrid = document.getElementById('admin-listings-mobile');

      const desktopHTML = currentProperties.map((p, idx) => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 12px;">
              <img src="${p.image.split(',')[0].trim()}" style="width: 50px; height: 40px; object-fit: cover; border-radius: 6px;" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
              <div>
                <strong>${p.title}</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${p.type}</div>
              </div>
            </div>
          </td>
          <td><strong style="color: var(--accent-gold);">${p.priceStr}</strong></td>
          <td>${p.location}</td>
          <td><span class="property-badge ${p.status === 'sale' ? 'badge-sale' : 'badge-rent'}" style="position:static;">${p.status === 'sale' ? 'FOR SALE' : 'FOR RENT'}</span></td>
          <td>
            <button onclick="editProperty(${idx})" class="btn btn-outline btn-sm">Edit</button>
            <button onclick="deleteProperty(${idx})" class="btn btn-sm" style="background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; margin-left: 6px;">Delete</button>
          </td>
        </tr>
      `).join('');

      const mobileHTML = currentProperties.map((p, idx) => `
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm);">
          <div style="display: flex; gap: 12px; margin-bottom: 10px;">
            <img src="${p.image.split(',')[0].trim()}" style="width: 70px; height: 56px; object-fit: cover; border-radius: 8px; flex-shrink: 0;" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
            <div style="flex: 1; min-width: 0;">
              <h4 style="font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;">${p.title}</h4>
              <div style="font-size: 0.78rem; color: var(--text-muted);">📍 ${p.location}</div>
              <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
                <strong style="color: var(--accent-gold); font-size: 0.9rem;">${p.priceStr}</strong>
                <span class="property-badge ${p.status === 'sale' ? 'badge-sale' : 'badge-rent'}" style="position:static; font-size: 0.6rem; padding: 2px 6px;">${p.status === 'sale' ? 'FOR SALE' : 'FOR RENT'}</span>
              </div>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border-color);">
            <button onclick="editProperty(${idx})" class="btn btn-outline btn-sm" style="width: 100%; padding: 8px;">✏️ Edit</button>
            <button onclick="deleteProperty(${idx})" class="btn btn-sm" style="width: 100%; padding: 8px; background: #fef2f2; color: #ef4444; border: 1px solid #fecaca;">🗑️ Delete</button>
          </div>
        </div>
      `).join('');

      if (desktopTbody) desktopTbody.innerHTML = desktopHTML;
      if (mobileGrid) mobileGrid.innerHTML = mobileHTML;
    }

    function openModal() {
      document.getElementById('prop-form').reset();
      document.getElementById('form-id').value = '';
      document.getElementById('modal-title').textContent = 'Add New Property';
      uploadedImageUrls = [];
      rebuildImageThumbsGrid();
      document.getElementById('property-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('property-modal').style.display = 'none';
    }

    function editProperty(idx) {
      const p = currentProperties[idx];
      document.getElementById('form-id').value = idx;
      document.getElementById('form-title').value = p.title;
      document.getElementById('form-price').value = p.price;
      document.getElementById('form-status').value = p.status;
      document.getElementById('form-location').value = p.location;
      document.getElementById('form-region').value = p.region;
      document.getElementById('form-type').value = p.type;
      document.getElementById('form-beds').value = p.beds;
      document.getElementById('form-baths').value = p.baths;
      document.getElementById('form-size').value = p.size;
      document.getElementById('form-tenure').value = p.tenure;
      document.getElementById('form-lotType').value = p.lotType;
      document.getElementById('form-description').value = p.description;

      uploadedImageUrls = p.image ? p.image.split(',').map(s => s.trim()) : [];
      rebuildImageThumbsGrid();

      document.getElementById('modal-title').textContent = 'Edit Property';
      document.getElementById('property-modal').style.display = 'flex';
    }

    function deleteProperty(idx) {
      if (confirm('Are you sure you want to delete this property?')) {
        currentProperties.splice(idx, 1);
        saveToStorage();
        renderTable();
      }
    }

    function saveProperty(e) {
      e.preventDefault();
      const idx = document.getElementById('form-id').value;
      const title = document.getElementById('form-title').value.trim();
      const price = parseFloat(document.getElementById('form-price').value);
      const status = document.getElementById('form-status').value;
      const location = document.getElementById('form-location').value.trim();
      const region = document.getElementById('form-region').value;
      const type = document.getElementById('form-type').value;
      const beds = parseInt(document.getElementById('form-beds').value);
      const baths = parseInt(document.getElementById('form-baths').value);
      const size = parseInt(document.getElementById('form-size').value);
      const tenure = document.getElementById('form-tenure').value;
      const lotType = document.getElementById('form-lotType').value;
      const description = document.getElementById('form-description').value.trim();

      const image = uploadedImageUrls.length > 0 ? uploadedImageUrls.join(', ') : "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1200&q=80";
      const slug = slugify(title);

      const propData = {
        id: idx !== '' ? currentProperties[idx].id : `prop-${Date.now()}`,
        slug: slug,
        title: title,
        price: price,
        priceStr: status === 'sale' ? `RM ${price.toLocaleString('en-US')}` : `RM ${price.toLocaleString('en-US')} / mo`,
        location: location,
        region: region,
        type: type,
        status: status,
        beds: beds,
        baths: baths,
        parking: 2,
        size: size,
        landSize: "-",
        tenure: tenure,
        lotType: lotType,
        image: image,
        description: description
      };

      if (idx !== '') {
        currentProperties[idx] = propData;
      } else {
        currentProperties.unshift(propData);
      }

      saveToStorage();
      renderTable();
      closeModal();
    }

    async function saveToStorage() {
      localStorage.setItem('ZAIM_ROSLI_PROPERTIES', JSON.stringify(currentProperties));
      try {
        await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/properties', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentProperties)
        });
      } catch (e) {
        console.error('KV save error:', e);
      }
    }

    async function handleImageUpload(e) {
      const files = Array.from(e.target.files);
      for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.url) {
            uploadedImageUrls.push(data.url);
          } else {
            throw new Error('No URL returned');
          }
        } catch (err) {
          console.error('Cloudflare R2 Upload error:', err);
          await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              uploadedImageUrls.push(ev.target.result);
              resolve();
            };
            reader.readAsDataURL(file);
          });
        }
      }
      rebuildImageThumbsGrid();
    }

    function rebuildImageThumbsGrid() {
      const grid = document.getElementById('image-thumbs-grid');
      grid.innerHTML = '';

      uploadedImageUrls.forEach((url, idx) => {
        const thumb = document.createElement('div');
        thumb.dataset.index = idx;
        thumb.style.cssText = 'position:relative; width:85px; height:65px; border-radius:8px; overflow:hidden; border:2px solid #cbd5e1; flex-shrink:0; cursor:grab; background:#fff; touch-action:none;';
        
        const isMain = idx === 0;

        thumb.innerHTML = `
          <img src="${url}" style="width:100%;height:100%;object-fit:cover;pointer-events:none;" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
          <button type="button" onclick="removeUploadedImage(${idx})" style="position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.7);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;" title="Remove Photo">&times;</button>
          ${isMain ? '<span style="position:absolute;bottom:3px;left:3px;background:#0f172a;color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;z-index:2;">Main Photo</span>' : ''}
        `;

        thumb.addEventListener('pointerdown', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          e.stopPropagation();
          thumb.setPointerCapture(e.pointerId);

          draggedIdx = idx;
          const rect = thumb.getBoundingClientRect();
          const ghost = thumb.cloneNode(true);
          ghost.style.cssText = `position:fixed; width:${rect.width}px; height:${rect.height}px; left:${rect.left}px; top:${rect.top}px; opacity:0.8; z-index:9999; pointer-events:none; border-radius:8px; border:2px solid #d97706; box-shadow:0 8px 24px rgba(0,0,0,0.3); transform:scale(1.06); transition:none;`;
          document.body.appendChild(ghost);
          thumb.style.opacity = '0.25';

          const offsetX = e.clientX - rect.left;
          const offsetY = e.clientY - rect.top;
          let dropTargetIdx = idx;

          const onMove = (ev) => {
            ghost.style.left = (ev.clientX - offsetX) + 'px';
            ghost.style.top = (ev.clientY - offsetY) + 'px';

            const thumbs = grid.querySelectorAll('[data-index]');
            thumbs.forEach(t => {
              const tRect = t.getBoundingClientRect();
              if (ev.clientX >= tRect.left && ev.clientX <= tRect.right && ev.clientY >= tRect.top && ev.clientY <= tRect.bottom) {
                dropTargetIdx = parseInt(t.dataset.index);
              }
            });
          };

          const onUp = () => {
            thumb.removeEventListener('pointermove', onMove);
            thumb.removeEventListener('pointerup', onUp);
            ghost.remove();
            thumb.style.opacity = '1';

            if (draggedIdx !== null && dropTargetIdx !== draggedIdx) {
              const [moved] = uploadedImageUrls.splice(draggedIdx, 1);
              uploadedImageUrls.splice(dropTargetIdx, 0, moved);
              rebuildImageThumbsGrid();
            }
            draggedIdx = null;
          };

          thumb.addEventListener('pointermove', onMove);
          thumb.addEventListener('pointerup', onUp);
        });

        grid.appendChild(thumb);
      });
    }

    function removeUploadedImage(idx) {
      uploadedImageUrls.splice(idx, 1);
      rebuildImageThumbsGrid();
    }
  </script>
</body>
</html>
