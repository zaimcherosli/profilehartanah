<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Zaim Rosli Hartanah</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }

    .admin-wrapper {
      padding-top: 110px;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header Styling */
    header.site-header {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid #e2e8f0 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02) !important;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .user-avatar-placeholder {
      width: 26px;
      height: 26px;
      background: #d97706;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .btn-logout {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
      margin-left: 8px;
      text-decoration: underline;
    }

    .btn-logout:hover {
      color: #dc2626;
    }

    /* Panel Card */
    .panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }

    .listings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .listings-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .btn-add {
      background: #0f172a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    .listings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .listing-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      transition: all 0.2s ease;
      gap: 20px;
    }

    .listing-item:hover {
      border-color: #cbd5e1;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.03);
    }

    .listing-thumb {
      width: 100px;
      height: 75px;
      border-radius: 10px;
      object-fit: cover;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .listing-info {
      flex: 1;
      min-width: 0;
    }

    .listing-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .listing-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-block;
    }

    .badge-sale-style {
      background: rgba(217, 119, 6, 0.1);
      color: #b45309;
    }

    .badge-rent-style {
      background: rgba(16, 185, 129, 0.1);
      color: #059669;
    }

    .listing-sub {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0;
    }

    .listing-price {
      font-weight: 800;
      color: #0f172a;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .action-btn.delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fecaca;
    }

    .listing-actions-desktop {
      display: flex;
      gap: 8px;
    }

    .listing-actions-mobile {
      display: none;
    }

    /* Floating Save Bar */
    .save-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      gap: 12px;
    }

    .btn-save-all {
      background: #10b981;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-save-all:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .thumbs-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      min-height: 80px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #d97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
    }

    /* Dedicated Mobile Responsive Overrides */
    @media (max-width: 768px) {
      .admin-wrapper {
        padding-top: 85px !important;
        padding-bottom: 95px !important;
      }
      .admin-container {
        padding: 0 12px !important;
      }
      header.site-header {
        height: auto !important;
        padding: 10px 0 !important;
      }
      .nav-wrapper {
        height: auto !important;
        gap: 10px !important;
      }
      .logo-main {
        font-size: 1.15rem !important;
      }
      .logo-sub {
        font-size: 0.55rem !important;
      }
      .user-badge {
        font-size: 0.78rem !important;
        padding: 4px 10px !important;
      }
      .user-badge #user-display {
        display: none !important;
      }
      .panel {
        padding: 16px 12px !important;
        border-radius: 16px !important;
      }
      .listings-header {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 12px !important;
        margin-bottom: 18px !important;
      }
      .btn-add {
        width: 100% !important;
        text-align: center !important;
        padding: 12px !important;
        height: 44px !important;
      }
      .listing-item {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 12px !important;
        padding: 14px !important;
        border-radius: 14px !important;
      }
      .listing-thumb {
        width: 100% !important;
        height: 180px !important;
        border-radius: 10px !important;
      }
      .listing-info {
        width: 100% !important;
      }
      .listing-title-row {
        flex-wrap: wrap !important;
        gap: 6px !important;
      }
      .listing-title {
        font-size: 0.98rem !important;
        white-space: normal !important;
      }
      .listing-sub {
        font-size: 0.84rem !important;
        line-height: 1.5 !important;
      }
      .listing-actions-desktop {
        display: none !important;
      }
      .listing-actions-mobile {
        display: flex !important;
        gap: 10px !important;
        width: 100% !important;
        margin-top: 10px !important;
        padding-top: 10px !important;
        border-top: 1px solid #e2e8f0 !important;
      }
      .save-bar {
        left: 16px !important;
        right: 16px !important;
        bottom: 16px !important;
      }
      .btn-save-all {
        width: 100% !important;
        justify-content: center !important;
        padding: 12px 20px !important;
        font-size: 0.9rem !important;
      }
      .modal-card {
        padding: 20px 16px !important;
        border-radius: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container nav-wrapper" style="display: flex; justify-content: space-between; align-items: center; height: 80px;">
      <a href="index.html" class="logo">
        <span class="logo-main">ZAIM<span>ROSLI</span></span>
        <span class="logo-sub">PORTAL EJEN (ADMIN)</span>
      </a>

      <div class="user-badge">
        <div class="user-avatar-placeholder">ZR</div>
        <span id="user-display">huzaimrosli@gmail.com</span>
        <button onclick="handleLogout()" class="btn-logout">Log Keluar</button>
      </div>
    </div>
  </header>

  <!-- Admin Main Wrapper -->
  <div class="admin-wrapper">
    <div class="admin-container">
      
      <!-- Panel Card -->
      <div class="panel" style="display: block;">
        
        <div class="listings-header">
          <h2>Urus Listings Hartanah</h2>
          <button onclick="openModal()" class="btn-add">+ Tambah Hartanah</button>
        </div>

        <!-- Listings Grid Container -->
        <div id="admin-listings-grid" class="listings-grid">
          <!-- Rendered dynamically -->
        </div>

      </div>

    </div>
  </div>

  <!-- Floating Save Button -->
  <div class="save-bar">
    <button onclick="forceSyncCloudflare()" class="btn-save-all">
      💾 Simpan ke Cloudflare R2
    </button>
  </div>

  <!-- Modal Add/Edit Property -->
  <div id="property-modal" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 id="modal-title" style="font-size: 1.3rem; font-weight: 800;">Tambah Hartanah</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #64748b;">&times;</button>
      </div>

      <form id="prop-form" onsubmit="saveProperty(event)">
        <input type="hidden" id="form-id">

        <div class="form-group" style="margin-bottom: 14px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">TAJUK HARTANAH</label>
          <input type="text" id="form-title" class="form-input" placeholder="Contoh: The Grand Pavilion Penthouse" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">HARGA (RM)</label>
            <input type="number" id="form-price" class="form-input" placeholder="1250000" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">STATUS</label>
            <select id="form-status" class="form-select" required>
              <option value="sale">FOR SALE</option>
              <option value="rent">FOR RENT</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">LOKASI (BANDAR / KAWASAN)</label>
            <input type="text" id="form-location" class="form-input" placeholder="KLCC, Kuala Lumpur" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">NEGERI</label>
            <select id="form-region" class="form-select" required>
              <option value="Kuala Lumpur">Kuala Lumpur</option>
              <option value="Selangor">Selangor</option>
              <option value="Penang">Penang</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">JENIS</label>
            <select id="form-type" class="form-select" required>
              <option value="Kondominium">Kondominium</option>
              <option value="Teres">Teres</option>
              <option value="Banglo">Banglo</option>
              <option value="Semi-D">Semi-D</option>
              <option value="Studio">Studio</option>
              <option value="Townhouse">Townhouse</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">BILIK</label>
            <input type="number" id="form-beds" class="form-input" value="3" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">B.AIR</label>
            <input type="number" id="form-baths" class="form-input" value="2" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">SQFT</label>
            <input type="number" id="form-size" class="form-input" placeholder="1200" required>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">PEGANGAN</label>
            <select id="form-tenure" class="form-select">
              <option value="Freehold">Freehold</option>
              <option value="Leasehold">Leasehold</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">LOT TYPE</label>
            <select id="form-lotType" class="form-select">
              <option value="Non-Bumi Lot">Non-Bumi Lot</option>
              <option value="Bumi Lot">Bumi Lot</option>
              <option value="Open Title">Open Title</option>
              <option value="Rezab Melayu">Rezab Melayu</option>
            </select>
          </div>
        </div>

        <!-- Image Upload & Drag Drop Grid -->
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">GAMBAR HARTANAH (MUAT NAIK CLOUDFLARE R2)</label>
          <div style="display: flex; gap: 10px; margin-bottom: 6px;">
            <input type="file" id="form-image-file" multiple accept="image/*" class="form-input" onchange="handleImageUpload(event)">
          </div>

          <div id="image-thumbs-grid" class="thumbs-grid">
            <!-- Rendered thumbs -->
          </div>
          <p style="font-size: 0.78rem; color: #64748b; margin-top: 6px;">
            💡 Tahan & seret gambar untuk ubah susunan. Gambar 1 adalah Gambar Utama.
          </p>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase;">DESKRIPSI HARTANAH</label>
          <textarea id="form-description" class="form-textarea" style="min-height: 100px;" required></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" onclick="closeModal()" class="btn btn-outline btn-sm">Batal</button>
          <button type="submit" class="btn btn-accent btn-sm">Simpan Hartanah</button>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="properties-data.js"></script>
  <script src="app.js"></script>
  <script>
    const SUPABASE_URL = 'https://csrzhidtzqxfbapsenhu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcnpoaWR0enF4ZmJhcHNlbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTM3OTYsImV4cCI6MjEwMTA2OTc5Nn0.NnHFURbQTvsdgGbm1d_PC-hkOgQFQIHKTMQaS2n44SU';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentProperties = [];
    let uploadedImageUrls = [];
    let draggedIdx = null;

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const localSess = localStorage.getItem('ZAIM_ROSLI_SESSION');
      if (!session && !localSess) {
        window.location.href = 'login.html';
        return;
      }
      loadPropertiesList();
    }
    checkAuth();

    async function handleLogout() {
      try {
        await supabaseClient.auth.signOut();
      } catch(e) {}
      localStorage.removeItem('ZAIM_ROSLI_SESSION');
      window.location.href = 'login.html?logout=true';
    }

    async function loadPropertiesList() {
      try {
        const res = await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/properties');
        const remoteData = await res.json();
        if (Array.isArray(remoteData) && remoteData.length > 0) {
          currentProperties = remoteData;
          localStorage.setItem('ZAIM_ROSLI_PROPERTIES', JSON.stringify(remoteData));
          renderListingsGrid();
          return;
        }
      } catch(e) {}

      const stored = localStorage.getItem('ZAIM_ROSLI_PROPERTIES');
      if (stored) {
        try {
          currentProperties = JSON.parse(stored);
        } catch(e) {
          currentProperties = PROPERTIES_DATA;
        }
      } else {
        currentProperties = PROPERTIES_DATA;
      }

      renderListingsGrid();
    }

    function renderListingsGrid() {
      const grid = document.getElementById('admin-listings-grid');
      grid.innerHTML = currentProperties.map((p, idx) => {
        const mainImg = p.image ? p.image.split(',')[0].trim() : 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80';
        const badgeClass = p.status === 'sale' ? 'badge-sale-style' : 'badge-rent-style';
        const badgeText = p.status === 'sale' ? 'FOR SALE' : 'FOR RENT';
        const priceDisplay = p.status === 'sale' ? `RM ${p.price.toLocaleString('en-US')}` : `RM ${p.price.toLocaleString('en-US')} / bln`;

        return `
          <div class="listing-item">
            <img src="${mainImg}" class="listing-thumb" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
            <div class="listing-info">
              <div class="listing-title-row">
                <h3 class="listing-title">${p.title}</h3>
                <span class="badge-status ${badgeClass}">${badgeText}</span>
              </div>
              <p class="listing-sub">
                <span class="listing-price">${priceDisplay}</span>
                <span style="margin: 0 4px;">•</span>
                ${p.location}
                <span style="margin: 0 4px;">•</span>
                ${p.type}
                <span style="margin: 0 4px;">•</span>
                ${p.beds} Bilik / ${p.baths} B.Air / ${p.size} sqft
              </p>
            </div>
            
            <!-- Desktop Action Icons -->
            <div class="listing-actions-desktop">
              <button onclick="editProperty(${idx})" class="action-btn" title="Edit Hartanah">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button onclick="deleteProperty(${idx})" class="action-btn delete" title="Padam Hartanah">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>

            <!-- Mobile Action Buttons -->
            <div class="listing-actions-mobile">
              <button onclick="editProperty(${idx})" style="background: #f8fafc; border: 1px solid #cbd5e1; color: #0f172a;">✏️ Edit</button>
              <button onclick="deleteProperty(${idx})" style="background: #fef2f2; border: 1px solid #fecaca; color: #ef4444;">🗑️ Padam</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal() {
      document.getElementById('prop-form').reset();
      document.getElementById('form-id').value = '';
      document.getElementById('modal-title').textContent = 'Tambah Hartanah';
      uploadedImageUrls = [];
      rebuildImageThumbsGrid();
      document.getElementById('property-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('property-modal').style.display = 'none';
    }

    function editProperty(idx) {
      const p = currentProperties[idx];
      document.getElementById('form-id').value = idx;
      document.getElementById('form-title').value = p.title;
      document.getElementById('form-price').value = p.price;
      document.getElementById('form-status').value = p.status;
      document.getElementById('form-location').value = p.location;
      document.getElementById('form-region').value = p.region;
      document.getElementById('form-type').value = p.type;
      document.getElementById('form-beds').value = p.beds;
      document.getElementById('form-baths').value = p.baths;
      document.getElementById('form-size').value = p.size;
      document.getElementById('form-tenure').value = p.tenure;
      document.getElementById('form-lotType').value = p.lotType;
      document.getElementById('form-description').value = p.description;

      uploadedImageUrls = p.image ? p.image.split(',').map(s => s.trim()) : [];
      rebuildImageThumbsGrid();

      document.getElementById('modal-title').textContent = 'Edit Hartanah';
      document.getElementById('property-modal').style.display = 'flex';
    }

    function deleteProperty(idx) {
      if (confirm('Adakah anda pasti untuk memadam hartanah ini?')) {
        currentProperties.splice(idx, 1);
        saveToStorage();
        renderListingsGrid();
      }
    }

    function saveProperty(e) {
      e.preventDefault();
      const idx = document.getElementById('form-id').value;
      const title = document.getElementById('form-title').value.trim();
      const price = parseFloat(document.getElementById('form-price').value);
      const status = document.getElementById('form-status').value;
      const location = document.getElementById('form-location').value.trim();
      const region = document.getElementById('form-region').value;
      const type = document.getElementById('form-type').value;
      const beds = parseInt(document.getElementById('form-beds').value);
      const baths = parseInt(document.getElementById('form-baths').value);
      const size = parseInt(document.getElementById('form-size').value);
      const tenure = document.getElementById('form-tenure').value;
      const lotType = document.getElementById('form-lotType').value;
      const description = document.getElementById('form-description').value.trim();

      const image = uploadedImageUrls.length > 0 ? uploadedImageUrls.join(', ') : "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=1200&q=80";
      const slug = slugify(title);

      const propData = {
        id: idx !== '' ? currentProperties[idx].id : `prop-${Date.now()}`,
        slug: slug,
        title: title,
        price: price,
        priceStr: status === 'sale' ? `RM ${price.toLocaleString('en-US')}` : `RM ${price.toLocaleString('en-US')} / bln`,
        location: location,
        region: region,
        type: type,
        status: status,
        beds: beds,
        baths: baths,
        parking: 2,
        size: size,
        landSize: "-",
        tenure: tenure,
        lotType: lotType,
        image: image,
        description: description
      };

      if (idx !== '') {
        currentProperties[idx] = propData;
      } else {
        currentProperties.unshift(propData);
      }

      saveToStorage();
      renderListingsGrid();
      closeModal();
    }

    async function forceSyncCloudflare() {
      const btn = document.querySelector('.btn-save-all');
      btn.innerHTML = '⌛ Memproses Cloudflare R2...';
      btn.disabled = true;
      await saveToStorage();
      setTimeout(() => {
        btn.innerHTML = '✅ Berjaya Disimpan ke R2!';
        setTimeout(() => {
          btn.innerHTML = '💾 Simpan ke Cloudflare R2';
          btn.disabled = false;
        }, 2000);
      }, 800);
    }

    async function saveToStorage() {
      localStorage.setItem('ZAIM_ROSLI_PROPERTIES', JSON.stringify(currentProperties));
      try {
        await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/properties', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentProperties)
        });
      } catch (e) {
        console.error('KV save error:', e);
      }
    }

    async function handleImageUpload(e) {
      const files = Array.from(e.target.files);
      for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await fetch('https://zaimrosli-worker.huzaimrosli.workers.dev/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.url) {
            uploadedImageUrls.push(data.url);
          } else {
            throw new Error('No URL returned');
          }
        } catch (err) {
          console.error('Cloudflare R2 Upload error:', err);
          await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              uploadedImageUrls.push(ev.target.result);
              resolve();
            };
            reader.readAsDataURL(file);
          });
        }
      }
      rebuildImageThumbsGrid();
    }

    function rebuildImageThumbsGrid() {
      const grid = document.getElementById('image-thumbs-grid');
      grid.innerHTML = '';

      uploadedImageUrls.forEach((url, idx) => {
        const thumb = document.createElement('div');
        thumb.dataset.index = idx;
        thumb.style.cssText = 'position:relative; width:85px; height:65px; border-radius:8px; overflow:hidden; border:2px solid #cbd5e1; flex-shrink:0; cursor:grab; background:#fff; touch-action:none;';
        
        const isMain = idx === 0;

        thumb.innerHTML = `
          <img src="${url}" style="width:100%;height:100%;object-fit:cover;pointer-events:none;" onerror="this.src='https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=400&q=80'">
          <button type="button" onclick="removeUploadedImage(${idx})" style="position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.7);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;" title="Buang Gambar">&times;</button>
          ${isMain ? '<span style="position:absolute;bottom:3px;left:3px;background:#0f172a;color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;z-index:2;">Utama</span>' : ''}
        `;

        thumb.addEventListener('pointerdown', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          e.preventDefault();
          e.stopPropagation();
          thumb.setPointerCapture(e.pointerId);

          draggedIdx = idx;
          const rect = thumb.getBoundingClientRect();
          const ghost = thumb.cloneNode(true);
          ghost.style.cssText = `position:fixed; width:${rect.width}px; height:${rect.height}px; left:${rect.left}px; top:${rect.top}px; opacity:0.8; z-index:9999; pointer-events:none; border-radius:8px; border:2px solid #d97706; box-shadow:0 8px 24px rgba(0,0,0,0.3); transform:scale(1.06); transition:none;`;
          document.body.appendChild(ghost);
          thumb.style.opacity = '0.25';

          const offsetX = e.clientX - rect.left;
          const offsetY = e.clientY - rect.top;
          let dropTargetIdx = idx;

          const onMove = (ev) => {
            ghost.style.left = (ev.clientX - offsetX) + 'px';
            ghost.style.top = (ev.clientY - offsetY) + 'px';

            const thumbs = grid.querySelectorAll('[data-index]');
            thumbs.forEach(t => {
              const tRect = t.getBoundingClientRect();
              if (ev.clientX >= tRect.left && ev.clientX <= tRect.right && ev.clientY >= tRect.top && ev.clientY <= tRect.bottom) {
                dropTargetIdx = parseInt(t.dataset.index);
              }
            });
          };

          const onUp = () => {
            thumb.removeEventListener('pointermove', onMove);
            thumb.removeEventListener('pointerup', onUp);
            ghost.remove();
            thumb.style.opacity = '1';

            if (draggedIdx !== null && dropTargetIdx !== draggedIdx) {
              const [moved] = uploadedImageUrls.splice(draggedIdx, 1);
              uploadedImageUrls.splice(dropTargetIdx, 0, moved);
              rebuildImageThumbsGrid();
            }
            draggedIdx = null;
          };

          thumb.addEventListener('pointermove', onMove);
          thumb.addEventListener('pointerup', onUp);
        });

        grid.appendChild(thumb);
      });
    }

    function removeUploadedImage(idx) {
      uploadedImageUrls.splice(idx, 1);
      rebuildImageThumbsGrid();
    }
  </script>
</body>
</html>
